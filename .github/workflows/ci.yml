name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter app test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore rules tests (emulator)
        run: pnpm --filter firestore-rules-tests emulator:test
      - run: ./scripts/build-site.sh
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      - name: Lighthouse CI (marketing)
        run: npx -y @lhci/cli@0.15 autorun --config=apps/marketing/lighthouserc.json
        continue-on-error: true
