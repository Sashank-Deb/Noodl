name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test # app unit tests, Supabase RLS tests (PGlite), AI function tests
      - run: ./scripts/build-site.sh
      - name: Lighthouse CI (marketing)
        run: npx -y @lhci/cli@0.15 autorun --config=apps/marketing/lighthouserc.json
        continue-on-error: true
# Deploys are done by Vercel's GitHub integration (every push to main → production).
